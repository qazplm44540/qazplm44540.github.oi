<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锐今阁 - 季节分类</title>
    <meta name="description" content="锐今阁新中式女装买手店，按季节分类浏览服装系列，融合传统中式美学与先锋解构设计语言。">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components/navigation.css">
    <link rel="stylesheet" href="css/components/button.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/pages/collection.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header class="c-navigation">
        <div class="c-navigation__container">
            <div class="c-navigation__brand">
                <a href="index.html" class="c-navigation__logo">锐今阁</a>
            </div>
            <nav class="c-navigation__menu">
                <ul class="c-navigation__list">
                    <li class="c-navigation__item">
                        <a href="index.html" class="c-navigation__link">首页</a>
                    </li>
                    <li class="c-navigation__item">
                        <a href="collection.html" class="c-navigation__link is-active">分类</a>
                    </li>
                    <li class="c-navigation__item">
                        <a href="items.html" class="c-navigation__link">单品</a>
                    </li>
                    <li class="c-navigation__item">
                        <a href="space.html" class="c-navigation__link">空间</a>
                    </li>
                </ul>
            </nav>
            <button class="c-navigation__toggle js-menu-toggle" aria-label="菜单切换">
                <span class="c-navigation__toggle-line"></span>
                <span class="c-navigation__toggle-line"></span>
                <span class="c-navigation__toggle-line"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Season Navigation -->
        <section class="season-nav">
            <div class="container">
                <h2 class="section-title">季节系列</h2>
                <div class="season-nav__grid js-season-nav">
                    <!-- Season cards will be dynamically loaded here -->
                </div>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <div class="container">
                <div class="filter-section__header">
                    <h2 class="filter-section__title">筛选</h2>
                    <button class="c-button c-button--text js-reset-filters">重置筛选</button>
                </div>

                <div class="filter-section__content">
                    <div class="filter-group">
                        <div class="filter-options js-season-filters">
                            <!-- Season filters will be dynamically loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Products Grid Section -->
        <section class="products-section">
            <div class="container">
                <div class="products-section__header">
                    <h2 class="products-section__title">产品系列</h2>
                    <div class="products-section__count js-products-count">
                        共 <span>0</span> 件产品
                    </div>
                </div>

                <div class="products-grid js-products-grid">
                    <!-- Products will be dynamically loaded here -->
                </div>

                <div class="products-section__no-results js-no-results" style="display: none;">
                    <p>没有找到符合筛选条件的产品</p>
                    <button class="c-button c-button--primary js-reset-filters">重置筛选</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__content">
                <div class="footer__brand">
                    <h3 class="footer__title">锐今阁</h3>
                    <p class="footer__tagline">柔古锐今，解构新生</p>
                </div>
                <div class="footer__contact">
                    <h4 class="footer__heading">联系我们</h4>
                    <p class="footer__info">地址：北京市朝阳区三里屯路19号</p>
                    <p class="footer__info">电话：010-88887777</p>
                    <p class="footer__info">邮箱：contact@ruijinge.com</p>
                </div>
                <div class="footer__hours">
                    <h4 class="footer__heading">营业时间</h4>
                    <p class="footer__info">周一至周五：10:00 - 20:00</p>
                    <p class="footer__info">周六至周日：10:00 - 21:00</p>
                </div>
            </div>
            <div class="footer__copyright">
                <p>&copy; 2025 锐今阁. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <!-- 先加载数据 -->
    <script src="js/data/products-data.js"></script>
    <script src="js/data/categories-data.js"></script>
    <!-- 再加载模块 -->
    <script src="js/modules/dataLoader.js"></script>
    <script src="js/modules/navigation.js"></script>
    <script src="js/modules/productCard.js"></script>
    <script src="js/modules/filterManager.js"></script>
    <!-- 最后加载页面脚本 -->
    <script src="js/pages/collection.js"></script>
</body>
</html>
